<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>AgriPulse — Smart Dairy Farm Management System for Kenyan Farmers</title>
    <meta name="description" content="AgriPulse is Kenya's leading dairy farm management platform. Track animals, milk production, health records, breeding cycles, farm finances and workers — all powered by AI. Free to start." />
    <meta name="keywords" content="dairy farm management Kenya, livestock tracking software, milk production tracker, farm management system Africa, cattle health records, breeding management, AgriPulse" />
    <meta name="author" content="AgriPulse" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#166534" />
    <link rel="canonical" href="https://agripulse.me" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgriPulse" />
    <meta property="og:url" content="https://agripulse.me" />
    <meta property="og:title" content="AgriPulse — Smart Dairy Farm Management for Kenyan Farmers" />
    <meta property="og:description" content="Track animals, milk production, health records, breeding and finances. AI-powered farm insights built specifically for Kenyan dairy farmers." />
    <meta property="og:image" content="https://agripulse.me/agripulse-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AgriPulse Farm Management Platform" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@agripulse" />
    <meta name="twitter:title" content="AgriPulse — Smart Dairy Farm Management" />
    <meta name="twitter:description" content="Kenya's AI-powered dairy farm management platform. Track animals, milk, health, breeding and finances." />
    <meta name="twitter:image" content="https://agripulse.me/agripulse-logo.png" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="KE" />
    <meta name="geo.placename" content="Kenya" />
    <meta name="language" content="English" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "AgriPulse",
      "alternateName": "AgriPulse Farm Management",
      "description": "Kenya's leading dairy farm management platform. Track animals, milk production, health records, breeding cycles, farm finances and workers — all powered by AI.",
      "url": "https://agripulse.me",
      "logo": "https://agripulse.me/logo.png",
      "image": "https://agripulse.me/agripulse-logo.png",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KES",
        "availability": "https://schema.org/InStock"
      },
      "featureList": [
        "Animal/Livestock Management",
        "Milk Production Tracking",
        "Health Records Management",
        "Breeding Cycle Management",
        "Farm Financial Management",
        "AI-Powered Farm Advisor",
        "Automated Email Alerts",
        "Weekly and Monthly Reports"
      ],
      "audience": {
        "@type": "Audience",
        "audienceType": "Dairy Farmers",
        "geographicArea": {
          "@type": "Country",
          "name": "Kenya"
        }
      },
      "provider": {
        "@type": "Organization",
        "name": "AgriPulse",
        "url": "https://agripulse.me",
        "email": "notifications@agripulse.me",
        "areaServed": "KE"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
